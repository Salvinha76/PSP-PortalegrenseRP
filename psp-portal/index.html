let me=null,sec='inicio',imgs=[],cart=[],lig=[],myRs=[];

const CAT=[

async function loadRs(){const{data}=await sb.from('relatorios').select('id,template,criado').eq('autor',me.id).order('criado',{ascending:false}).limit(25);myRs=data||[]}

async function calc(){
 await loadRs();cart=[];lig=[];
 $('#main').innerHTML=`<h2>Calculadora de Infrações</h2><p class="m">Escolhe as infrações e os crimes, ajusta os valores se for preciso e regista. Os valores são sugestões dentro da moldura legal.</p><div class="cg"><div><div class="card"><h3>Suspeito</h3><div class="row"><input id="s_n" placeholder="Nome"><input id="s_i" placeholder="Idade"><input id="s_c" placeholder="Nº Cartão Cidadão"></div><label for="c_t">Tipo de ocorrência</label><select id="c_t" onchange="catList();regs()"><option>Infração</option><option>Detenção</option></select><input id="c_q" placeholder="Pesquisar infração ou crime..." oninput="catList()" style="margin-top:10px"></div><div id="cat"></div><button class="btn ghost" onclick="addX()">Adicionar linha manual</button></div><div class="reg" id="reg"></div></div>`;
 catList();regs();
}
function catList(){const d=$('#c_t').value=='Detenção',q=$('#c_q').value.toLowerCase();
 $('#cat').innerHTML=NV.map(([t,c],n)=>{if(!d&&n>2)return'';const it=CAT.map((x,i)=>[x,i]).filter(([x])=>x[0]==n&&(!q||x[1].toLowerCase().includes(q)));if(!it.length)return'';

 return`**POLÍCIA DE SEGURANÇA PÚBLICA**\n**COMANDO DISTRITAL PORTALEGRE**\n${E}\n**${tipo.toUpperCase()} Nº ${id}**\n${D}\n**■  AGENTE**\n  ▪ Nome: ${me.patente} ${me.nome}\n  ▪ Nº Mec.: ${me.numero}\n${P}\n**■  SUSPEITO**\n  ▪ Nome: ${s.nome}\n  ▪ Idade: ${s.idade||'—'}\n  ▪ Nº Cartão Cidadão: ${s.cc||'—'}\n${B}\n**■  ${d?'INFRAÇÕES E CRIMES':'INFRAÇÕES'}**\n`+cart.map(c=>`  ▪ ${c.q}× ${c.n}`+(c.f?` · ${(c.q*c.f).toLocaleString('pt-PT')} €`:'')+(d&&c.m?` · ${fmtP(c.q*c.m)}`:'')).join('\n')+`\n${D}\n**◆  TOTAIS**\n  ▪ Coimas: ${f.toLocaleString('pt-PT')} €`+(m?`\n  ▪ Pena de prisão: ${fmtP(m)}`:'')+(lig.length?`\n${P}\n**■  RELATÓRIOS ANEXOS**\n${ligTxt()}`:'')+`\n${E}`}

 const n=$('#s_n').value.trim();if(!n)return toast('Indica o nome do suspeito.',1);if(!cart.length)return toast('Adiciona pelo menos uma infração ou crime.',1);
 const b=$('#cs');b.disabled=true;const d=$('#c_t').value=='Detenção',t=tot(),tipo=d?'Detenção':'Infração',sus={nome:n,idade:$('#s_i').value.trim(),cc:$('#s_c').value.trim()};
 const{data:row,error}=await sb.from('autos').insert({autor:me.id,numero:me.numero,tipo,suspeito:sus,itens:cart,total_coima:t.f,prisao_meses:t.m,relatorios:lig}).select('id').single();

 const txt=buildAuto(row.id,tipo,sus,t.f,t.m);await sb.from('autos').update({texto:txt}).eq('id',row.id);

 toast(r.ok?`${tipo} Nº ${row.id} registada e enviada.`:`${tipo} Nº ${row.id} guardada, mas o Discord falhou.`,!r.ok);calc()}

function closeM(){$('#modal')?.remove()}
async function fn(n,b){const{data:{session}}=await sb.auth.getSession();const r=await fetch('/.netlify/functions/'+n,{method:'POST',headers:{Authorization:'Bearer '+session.access_token},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));return{...j,ok:r.ok}}

function loginView(){$('#root').innerHTML=`<div class="lgn"><div class="hero"><img src="assets/logo-psp-bandeira.png" alt=""></div><form class="box" onsubmit="return doLogin(event)"><img src="assets/logo-psp.png" alt="Polícia de Segurança Pública"><h2>Portal Operacional</h2><p class="m">Acesso reservado aos elementos da PSP de Portalegre.</p><label for="n">Nº mecanográfico ou email</label><input id="n" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Nº mecanográfico ou email" required><label for="p">Palavra-passe</label><input id="p" type="password" autocomplete="current-password" required><button class="btn" id="login-submit">Entrar</button><div id="err" class="bad" role="alert" aria-live="polite"></div></form></div>`}
async function doLogin(e){
 e.preventDefault();
 const b=$('#login-submit'),err=$('#err');if(b.disabled)return false;
 b.disabled=true;b.textContent='A entrar…';err.textContent='';
 const identifier=$('#n').value.trim().toLowerCase();
 try{
  const{error}=await sb.auth.signInWithPassword({email:identifier.includes('@')?identifier:identifier+'@psp.rp',password:$('#p').value});
  if(error){err.textContent=error.status==429?'Demasiadas tentativas. Aguarda um momento e tenta novamente.':(!error.status||error.status>=500)?'Não foi possível ligar ao serviço de autenticação. Tenta novamente.':'Nº mecanográfico, email ou palavra-passe incorretos.';return false}
  await start();
 }catch{err.textContent='Não foi possível ligar ao serviço de autenticação. Tenta novamente.'}
 finally{b.disabled=false;b.textContent='Entrar'}
 return false;
}
async function logout(){await sb.auth.signOut();me=null;loginView()}

async function start(){
 const{data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;if(!session)return loginView();
 const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error){loginView();$('#err').textContent='Não foi possível carregar o perfil. Tenta novamente ou contacta a direção.';return}
 if(!data||!data.ativo){await sb.auth.signOut();me=null;loginView();$('#err').textContent='Conta inativa ou sem perfil. Contacta a direção.';return}
 me=data;shell();
 if(me.must_change_password)pwModal();else if(!me.tutorial_done)tutorial();
}
function shell(){
 const nav=[['inicio','Início'],['efetivos','Quadro de Efetivos'],['relatorios','Relatórios'],['calc','Calculadora de Infrações']];if(me.nivel=='diretor')nav.push(['direcao','Direção']);
 $('#root').innerHTML=`<div class="app"><aside id="side"><div class="lg"><img src="assets/logo-psp.png" alt="PSP"></div><nav>${nav.map(([k,v])=>`<a id="nav-${k}" data-s="${k}" onclick="go('${k}')">${v}</a>`).join('')}</nav><div class="usr"><b>${esc(me.patente)} ${esc(me.nome)}</b>Nº ${esc(me.numero)}<br><a class="lk" onclick="logout()">Terminar sessão</a></div></aside><main id="main"></main></div>`;
 go(sec);
}
function go(s){sec=s;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.s==s));$('#main').innerHTML='';({inicio,efetivos,relatorios,calc,direcao})[s]()}

function pwModal(){modal(`<h3>Define a tua palavra-passe</h3><p class="m">A conta foi criada pela direção. Escolhe agora uma palavra-passe só tua (mínimo 8 caracteres).</p><label for="np1">Nova palavra-passe</label><input id="np1" type="password"><label for="np2">Repetir palavra-passe</label><input id="np2" type="password"><div id="pe" class="bad"></div><button class="btn" style="width:100%;margin-top:16px" onclick="setPw()">Guardar palavra-passe</button>`)}
async function setPw(){const a=$('#np1').value;if(a.length<8)return $('#pe').textContent='Usa pelo menos 8 caracteres.';if(a!=$('#np2').value)return $('#pe').textContent='As palavras-passe não coincidem.';
 const{error}=await sb.auth.updateUser({password:a});if(error)return $('#pe').textContent='Não foi possível guardar. Tenta outra palavra-passe.';
 await sb.rpc('finish_password');me.must_change_password=false;closeM();if(!me.tutorial_done)tutorial()}

const STEPS=[['#nav-inicio','Início','O resumo da tua conta e atalhos para as secções que mais usas.'],['#nav-efetivos','Quadro de Efetivos','Consulta os elementos da corporação, a patente, a direção e o estado de cada um. Só a direção o pode alterar.'],['#nav-relatorios','Relatórios','Escolhe um modelo, preenche os campos, cola fotografias com Ctrl+V e envia. O relatório segue formatado para o Discord.'],['#nav-calc','Calculadora de Infrações','Escolhe as infrações e os crimes cometidos, vê o total das coimas a verde e a pena de prisão a vermelho, anexa relatórios e envia o registo para o Discord.'],['#nav-direcao','Direção','Aqui crias contas de agentes e repões palavras-passe.'],['#side .usr','A tua conta','Vês aqui quem és. Termina sempre a sessão no fim do turno.']];
function tutorial(i=0){
 const st=STEPS.filter(s=>$(s[0]));
 if(i>=st.length){sb.rpc('finish_tutorial');me.tutorial_done=true;$('#tut')?.remove();return}
 const[s,t,x]=st[i],r=$(s).getBoundingClientRect(),p=6,x1=r.left-p,y1=r.top-p,x2=r.right+p,y2=r.bottom+p;
 let o=$('#tut');if(!o){o=document.createElement('div');o.id='tut';document.body.append(o)}
 o.innerHTML=`<div class="veil" style="clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 0,${x1}px ${y1}px,${x1}px ${y2}px,${x2}px ${y2}px,${x2}px ${y1}px,${x1}px ${y1}px)"></div><div class="ring" style="left:${x1}px;top:${y1}px;width:${x2-x1}px;height:${y2-y1}px"></div><div class="tc" style="left:${x2+18}px;top:${Math.max(12,y1)}px"><small>Passo ${i+1} de ${st.length}</small><h3>${t}</h3><p>${x}</p><div class="row"><button class="btn ghost" onclick="tutorial(${st.length})">Saltar</button><button class="btn" onclick="tutorial(${i+1})">${i+1==st.length?'Concluir':'Seguinte'}</button></div></div>`;
}

async function inicio(){
 const{count}=await sb.from('efetivos').select('*',{count:'exact',head:true});
 $('#main').innerHTML=`<h2>Bem-vindo, ${esc(me.patente)} ${esc(me.nome)}</h2><p class="m">Nº ${esc(me.numero)} · ${esc(me.direcao||'')}</p><div class="grid" style="margin-top:18px"><div class="card"><span class="m">Elementos no quadro</span><b class="big">${count??0}</b></div><div class="card cl" onclick="go('efetivos')"><h3>Quadro de Efetivos</h3><p class="m">Consultar elementos e estados.</p></div><div class="card cl" onclick="go('relatorios')"><h3>Relatórios</h3><p class="m">Preencher e enviar para o Discord.</p></div></div>`;
}

async function efetivos(){
 const{data}=await sb.from('efetivos').select('*').order('direcao').order('nome');const d=me.nivel=='diretor';
 $('#main').innerHTML=`<h2>Quadro de Efetivos</h2>${d?`<div class="card"><h3>Adicionar elemento</h3><div class="row"><input id="e_n" placeholder="Nº"><input id="e_m" placeholder="Nome"><select id="e_p">${opt(PAT)}</select><select id="e_d">${opt(DIR)}</select><button class="btn" onclick="addEf()">Adicionar</button></div></div>`:''}<div class="card"><div class="tw"><table><tr><th>Nº<th>Nome<th>Patente<th>Direção<th>Estado${d?'<th>':''}</tr>${(data||[]).map(e=>`<tr><td>${esc(e.numero)}<td>${esc(e.nome)}<td>${esc(e.patente)}<td>${esc(e.direcao)}<td>${d?`<select onchange="setEf(${e.id},this.value)">${opt(ES,e.estado)}</select><td><button class="btn ghost sm" onclick="delEf(${e.id})">Remover</button>`:`<span class="tag">${esc(e.estado)}</span>`}</tr>`).join('')}</table></div></div>`;
}
async function addEf(){const nome=$('#e_m').value.trim();if(!nome)return toast('Indica o nome.',1);const{error}=await sb.from('efetivos').insert({numero:$('#e_n').value.trim(),nome,patente:$('#e_p').value,direcao:$('#e_d').value});if(error)return toast('Erro ao adicionar.',1);efetivos()}
async function setEf(id,v){const{error}=await sb.from('efetivos').update({estado:v}).eq('id',id);toast(error?'Erro ao guardar.':'Estado atualizado.',!!error)}
async function delEf(id){if(!confirm('Remover este elemento do quadro?'))return;await sb.from('efetivos').delete().eq('id',id);efetivos()}

async function relatorios(){
 imgs=[];lig=[];await loadRs();
 $('#main').innerHTML=`<h2>Relatórios</h2><p class="m">Escolhe um modelo, preenche e envia. O texto é formatado automaticamente.</p><div class="card"><label for="tpl">Modelo</label><select id="tpl" onchange="formTpl()">${Object.entries(TPL).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><div id="fm"></div><label>Fotografias</label><div class="drop">Cola uma imagem com Ctrl+V ou <label class="lk">escolhe ficheiros<input type="file" accept="image/*" multiple hidden onchange="upl(this.files)"></label></div><div class="row"><input id="lnk" placeholder="Ou cola o link de uma imagem"><button class="btn ghost" onclick="addLnk()">Adicionar link</button></div><div id="th" class="th"></div><label>Anexar outros relatórios (opcional)</label><div id="lg">${lgBox()}</div><div class="row"><button class="btn ghost" onclick="prev()">Pré-visualizar</button><button class="btn" id="sd" onclick="send()">Enviar para o Discord</button></div><pre id="pv" class="pv" hidden></pre></div><h3>Últimos relatórios</h3><div id="hs" class="card"></div>`;
 formTpl();histo();
}
const fld=([i,l,t,o])=>`<label for="f_${i}">${l}</label>`+(t=='s'?`<select id="f_${i}">${opt(o)}</select>`:(t=='a'||t=='x')?`<textarea id="f_${i}" rows="3"></textarea>`:`<input id="f_${i}">`);
function formTpl(){const T=TPL[$('#tpl').value];$('#fm').innerHTML=T.S.map((s,i)=>`<fieldset class="fs"><legend>${s.h}</legend>${s.gate?`<label for="f_${s.gate[0]}">${s.gate[1]}</label><select id="f_${s.gate[0]}" onchange="$('#g${i}').hidden=this.value!='Sim'"><option>Não</option><option>Sim</option></select>`:''}<div id="g${i}"${s.gate?' hidden':''}>${s.f.map(fld).join('')}</div></fieldset>`).join('');
 const n=new Date(),p=x=>String(x).padStart(2,'0'),set=(i,x)=>$('#f_'+i)&&($('#f_'+i).value=x);
 set('ag',`${me.patente} ${me.nome}`);set('nm',me.numero);set('dt',`${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()}`);set('hr',`${p(n.getHours())}:${p(n.getMinutes())}`)}
function vals(){const k=$('#tpl').value,v={};TPL[k].S.forEach(s=>{if(s.gate)v[s.gate[0]]=$('#f_'+s.gate[0]).value;s.f.forEach(f=>v[f[0]]=$('#f_'+f[0]).value.trim())});return[k,v]}
function build(k,v,id){const T=TPL[k],on=T.S.filter(s=>!s.gate||v[s.gate[0]]=='Sim');
 let o=`**POLÍCIA DE SEGURANÇA PÚBLICA**\n**COMANDO DISTRITAL PORTALEGRE**\n${E}\n**${T.t}${id?' Nº '+id:''}**\n${D}\n`;
 on.forEach((s,i)=>{o+=`**${s.gate?'◆':'■'}  ${s.h}**\n`+s.f.map(([id,l,t])=>{let x=v[id]||(id=='rs'?(v.inf=='Sim'?'Infração detetada. Ver secção Infração.':'Sem infrações detetadas. Condutor dispensado.'):'—');return t=='x'?'  '+x.replace(/\n/g,'\n  '):`  ▪ ${l.replace(/ \(.*\)/,'')}: ${x}`}).join('\n')+'\n'+(i<on.length-1?SEP[s.s]:E)+'\n'});
 if(lig.length)o=o.slice(0,-E.length-1)+`${P}\n**■  RELATÓRIOS ANEXOS**\n${ligTxt()}\n${E}\n`;
 return o}
function prev(){const[k,v]=vals(),p=$('#pv');p.hidden=false;p.textContent=build(k,v).replace(/\*\*/g,'')}
function thumbs(){$('#th').innerHTML=imgs.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button onclick="imgs.splice(${i},1);thumbs()" aria-label="Remover">×</button></div>`).join('')}
function addLnk(){const u=$('#lnk').value.trim();if(!/^https?:\/\//.test(u))return toast('Cola um link que comece por http.',1);imgs.push(u);$('#lnk').value='';thumbs()}
async function upl(fs){for(const f of fs){const p=`${me.numero}/${Date.now()}-${Math.random().toString(36).slice(2,6)}.${f.type.split('/')[1]||'png'}`;const{error}=await sb.storage.from('anexos-relatorios').upload(p,f,{contentType:f.type});if(error){toast('Falha ao carregar a imagem.',1);continue}imgs.push(sb.storage.from('anexos-relatorios').getPublicUrl(p).data.publicUrl)}thumbs()}
document.addEventListener('paste',e=>{if(sec!='relatorios'||!e.clipboardData)return;const f=[...e.clipboardData.files].filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();upl(f)}});
async function send(){
 const[k,v]=vals();const q=TPL[k].req.find(i=>!v[i]);if(q)return toast('Falta preencher: '+TPL[k].S.flatMap(x=>x.f).find(f=>f[0]==q)[1],1);
 const b=$('#sd');b.disabled=true;
 const{data:row,error}=await sb.from('relatorios').insert({autor:me.id,numero:me.numero,template:TPL[k].n,dados:v,anexos:imgs,ligados:lig}).select('id').single();
 if(error){b.disabled=false;return toast('Erro ao guardar o relatório.',1)}
 const txt=build(k,v,row.id);await sb.from('relatorios').update({texto:txt}).eq('id',row.id);
 const r=await fn('send-report',{canal:'relatorios',text:txt,images:imgs});
 toast(r.ok?`Relatório Nº ${row.id} enviado para o Discord.`:`Relatório Nº ${row.id} guardado, mas o Discord falhou.`,!r.ok);relatorios();
}
async function histo(){const{data}=await sb.from('relatorios').select('id,template,numero,criado').order('criado',{ascending:false}).limit(10);$('#hs').innerHTML=(data&&data.length)?`<table>${data.map(r=>`<tr><td>${esc(r.template)} Nº ${r.id}<td>Agente ${esc(r.numero)}<td>${new Date(r.criado).toLocaleString('pt-PT')}</tr>`).join('')}</table>`:'<span class="m">Ainda não enviaste nenhum relatório.</span>'}

async function direcao(){
 const{data}=await sb.from('profiles').select('*').order('numero');
 $('#main').innerHTML=`<h2>Direção · Contas</h2><div class="card"><h3>Criar conta</h3><div class="row"><input id="a_n" placeholder="Nome (ex.: João Silva)"><select id="a_p">${opt(PAT)}</select><select id="a_d">${opt(DIR)}</select><select id="a_v"><option value="agente">Agente</option><option value="diretor">Diretor</option></select><button class="btn" onclick="criar()">Criar conta</button></div><p class="m">O nº mecanográfico é atribuído automaticamente e é gerada uma palavra-passe temporária.</p></div><div class="card"><div class="tw"><table><tr><th>Nº<th>Nome<th>Patente<th>Nível<th></tr>${(data||[]).map(p=>`<tr><td>${esc(p.numero)}<td>${esc(p.nome)}<td>${esc(p.patente)}<td><span class="tag">${esc(p.nivel)}</span><td><button class="btn ghost sm" onclick="rst('${p.id}')">Repor palavra-passe</button></tr>`).join('')}</table></div></div>`;
}
function credenciais(t,n,pw){modal(`<h3>${t}</h3>${n?`<p>Nº mecanográfico: <b>${n}</b></p>`:''}<p>Palavra-passe temporária: <code>${pw}</code></p><p class="m">Entrega estes dados ao agente. No primeiro acesso terá de definir a sua própria palavra-passe.</p><button class="btn" onclick="closeM()">Fechar</button>`)}
async function criar(){const nome=$('#a_n').value.trim();if(!nome)return toast('Indica o nome do agente.',1);
 const r=await fn('create-agent',{action:'create',nome,patente:$('#a_p').value,direcao:$('#a_d').value,nivel:$('#a_v').value});
 if(!r.ok)return toast(r.error||'Erro ao criar a conta.',1);credenciais('Conta criada',r.numero,r.password);direcao()}
async function rst(id){if(!confirm('Repor a palavra-passe desta conta?'))return;const r=await fn('create-agent',{action:'reset',id});if(!r.ok)return toast(r.error||'Erro.',1);credenciais('Palavra-passe reposta','',r.password)}

start().catch(()=>{loginView();$('#err').textContent='Não foi possível iniciar a sessão. Tenta novamente.'});
</script></body></html>
